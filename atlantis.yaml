version: 3
automerge: false
delete_source_branch_on_merge: true
projects:
  - name: ecs-fargate-infrastructure
    dir: terraform
    workspace: default
    terraform_version: v1.9.0
    autoplan:
      when_modified:
        - "*.tf"
        - "*.tfvars"
        - "modules/**/*.tf"
      enabled: true
    apply_requirements:
      - mergeable
